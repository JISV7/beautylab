services:
  db:
    image: postgres:17
    container_name: cursorg-db
    restart: always
    environment:
      TZ: America/Caracas
      PGTZ: America/Caracas
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cursorg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cursorg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cursorg-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      TZ: America/Caracas
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cursorg}
      APP_NAME: "Cursorg API"
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/entrypoint.sh:/app/entrypoint.sh
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - backend_uploads:/app/uploads

volumes:
  # NOTE: The database name changed from "beautylab" to "cursorg".
  # Existing postgres_data volumes are NOT migrated automatically. Back up your data and
  # either restore it into a new "cursorg" database or recreate the volume with
  # `docker compose down -v` (this deletes the old database).
  postgres_data:
  backend_uploads:
